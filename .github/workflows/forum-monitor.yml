name: Forum Monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: forum-monitor
  cancel-in-progress: true

permissions:
  issues: write

jobs:
  monitor:
    runs-on: [self-hosted, spoton]
    env:
      SCRIPTS_DIR: /home/sti/.spoton-forum-monitor/scripts
      STATE_DIR: /home/sti/.spoton-forum-monitor
    steps:
      - name: Install dependencies
        working-directory: ${{ env.SCRIPTS_DIR }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ env.SCRIPTS_DIR }}
        run: npx playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium

      - name: Restore state
        working-directory: ${{ env.SCRIPTS_DIR }}
        run: |
          [ -f "$STATE_DIR/forum-state.json" ] && cp "$STATE_DIR/forum-state.json" forum-state.json || true

      - name: Run forum monitor
        working-directory: ${{ env.SCRIPTS_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_PATH: forum-state.json
        run: node index.js

      - name: Save state
        if: always()
        working-directory: ${{ env.SCRIPTS_DIR }}
        run: |
          [ -f forum-state.json ] && cp forum-state.json "$STATE_DIR/forum-state.json" || true
